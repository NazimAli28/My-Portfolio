<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B0C10" />
    <title>Muhammad Nazim Ali, software developer</title>
    <meta
      name="description"
      content="Muhammad Nazim Ali builds internal business tools in Python, PHP and SQL: approval workflows, task tracking and chat bots. Case studies, resume and contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Nazim Ali, software developer" />
    <meta
      property="og:description"
      content="Case studies of SalesHub, TeamHub and OpsBot: internal tools used by real teams."
    />
    <!-- No-flash theme: runs before paint. Saved choice > OS preference > dark. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
